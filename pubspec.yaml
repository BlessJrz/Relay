name: relay
description: "Relay — an iMessage bridge for Android, powered by your Mac running BlueBubbles Server."
publish_to: 'none'
version: 1.1.3+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.0
  video_player: ^2.9.2
  record: ^7.1.2
  gal: ^2.3.3
  local_auth: ^3.0.2
  socket_io_client: ^3.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  mobile_scanner: ^7.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  camera: ^0.12.2
  photo_manager: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
