name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Build
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee build.log
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee -a build.log
      - name: Publish build errors
        if: failure()
        run: |
          grep -E "^e: |rror:|What went wrong|Could not|Exception|> " build.log | head -400 > errors.txt || true
          tail -150 build.log >> errors.txt
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rfq --cached . >/dev/null
          git add -f errors.txt
          git commit -qm "build ${{ github.run_number }} errors"
          git push -f origin ci-logs
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Relay-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Relay-APK
          path: Relay-*.apk
      - name: Publish rolling release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Relay-${{ github.run_number }}.apk --title "Relay build ${{ github.run_number }}" --notes "Open this page on your Fold7, tap the APK to download, then install. Built from ${{ github.sha }}." --prerelease
permissions:
  contents: write
